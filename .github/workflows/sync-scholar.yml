name: Sync Google Scholar citations

on:
  schedule:
    # Check daily at 08:00 Asia/Shanghai; sync only after 72 full hours.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the 72-hour gate
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: scholar-citation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scholar-notion-sync/pyproject.toml
      - name: Install citation synchronizer
        run: python -m pip install ./tools/scholar-notion-sync
      - name: Update Notion and citation data interface
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAPERS_DATABASE_ID: ${{ secrets.PAPERS_DATABASE_ID }}
          SNAPSHOTS_DATABASE_ID: ${{ secrets.SNAPSHOTS_DATABASE_ID }}
          SCHOLAR_AUTHOR_ID: 9RAuZ4YAAAAJ
          SCHOLAR_FEED_PATH: static/data/scholar-citations.json
          SYNC_INTERVAL_HOURS: 72
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: scholar-notion-sync
      - name: Commit updated data interface
        run: |
          if git diff --quiet -- static/data/scholar-citations.json; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/scholar-citations.json
          git commit -m "chore: update Google Scholar citations"
          git push
